task: task_screenspot_v2_mobile_guiowl
dataset_path: json
dataset_kwargs:
  data_files: "data/screenspot_v2_mobile/eval_index.json"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.screenspot_v2_mobile_doc_to_visual
doc_to_text: ""
doc_to_messages: !function utils.screenspot_v2_mobile_doc_to_messages
doc_to_target: !function utils.screenspot_v2_mobile_doc_to_target
process_results: !function utils.screenspot_v2_mobile_process_result
generation_kwargs:
  max_new_tokens: 4096
  temperature: 0
  do_sample: false
  early_stop_on_action: false
metric_list:
  - metric: screenspot_v2_mobile_center_acc
    aggregation: !function utils.screenspot_v2_mobile_aggregate_center_acc
    higher_is_better: true
lmms_eval_specific_kwargs:
  media_dir: "data/screenspot_v2_mobile/images"
  coordinate_type: "normalized"
metadata:
  version: 1
  platform_domain: mobile
  protocol: screenspot_v2_mobile_center_acc_v1
  source: OS-Copilot/ScreenSpot-v2
  model_baseline: GUI-Owl-1.5-8B-Instruct
  inference_backend: transformers_lmms_eval
