task: task_mind2web_qwen3_omni_domain
dataset_path: json
dataset_kwargs:
  data_files: "data/mind2web/merged_sorted_domain.json"
test_split: train
output_type: generate_until
doc_to_visual: !function process_results.mind2web_doc_to_visual
doc_to_text: ""
doc_to_messages: !function process_results.mind2web_dialogue_doc_to_messages
doc_to_target: !function process_results.mind2web_doc_to_target
process_results: !function process_results.mind2web_omni_process_result
generation_kwargs:
  max_new_tokens: 4096
  temperature: 0
  do_sample: false
metric_list:
  - metric: m2w_ele_acc
    aggregation: !function process_results.mind2web_aggregate_ele_acc
    higher_is_better: true
  - metric: m2w_op_f1
    aggregation: !function process_results.mind2web_aggregate_op_f1
    higher_is_better: true
  - metric: m2w_step_sr
    aggregation: !function process_results.mind2web_aggregate_step_sr
    higher_is_better: true
  - metric: type_match
    aggregation: !function utils_eval_extensions.omni_aggregate_type_match
    higher_is_better: true
  - metric: exact_match
    aggregation: !function utils_eval_extensions.omni_aggregate_exact_match
    higher_is_better: true
  - metric: success_rate
    aggregation: !function utils_eval_extensions.omni_aggregate_success_rate
    higher_is_better: true
  - metric: goal_progress
    aggregation: !function utils_eval_extensions.omni_aggregate_goal_progress
    higher_is_better: true
  - metric: e2e_latency_ms
    aggregation: !function utils_eval_extensions.omni_aggregate_e2e_latency_ms
    higher_is_better: false
  - metric: vision_prefill_ms
    aggregation: !function utils_eval_extensions.omni_aggregate_vision_prefill_ms
    higher_is_better: false
  - metric: pruning_ms
    aggregation: !function utils_eval_extensions.omni_aggregate_pruning_ms
    higher_is_better: false
  - metric: llm_prefill_ms
    aggregation: !function utils_eval_extensions.omni_aggregate_llm_prefill_ms
    higher_is_better: false
  - metric: decode_latency_ms
    aggregation: !function utils_eval_extensions.omni_aggregate_decode_latency_ms
    higher_is_better: false
  - metric: misc_ms
    aggregation: !function utils_eval_extensions.omni_aggregate_misc_ms
    higher_is_better: false
lmms_eval_specific_kwargs:
  media_dir: "data/mind2web"
  eval_android_control: true
  qwen_include_history: true
  max_history_turns: 9
  supports_session_kv: true
metadata:
  version: 1
  protocol: mind2web_seeclick_qwen3_omni_v1
  m2w_split: test_domain
  supports_session_kv: true
