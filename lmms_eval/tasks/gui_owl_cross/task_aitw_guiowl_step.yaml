task: task_aitw_guiowl_step
dataset_path: json
dataset_kwargs:
  data_files: "data/aitw/steps/standard_test_steps.json"
test_split: train
output_type: generate_until
doc_to_visual: !function process_results.aitw_doc_to_visual
doc_to_text: ""
doc_to_messages: !function process_results.aitw_doc_to_messages
doc_to_target: !function process_results.aitw_doc_to_target
process_results: !function process_results.aitw_process_result
generation_kwargs:
  max_new_tokens: 4096
  temperature: 0
  do_sample: false
metric_list:
  - metric: aitw_action_match
    aggregation: !function process_results.aitw_aggregate_action_match
    higher_is_better: true
  - metric: aitw_action_match_macro
    aggregation: !function process_results.aitw_aggregate_by_subset
    higher_is_better: true
lmms_eval_specific_kwargs:
  media_dir: "data/aitw/images"
  coordinate_type: "normalized"
metadata:
  version: 1
  protocol: aitw_action_matching_single_step
  subsets: general,install,web_shopping,google_apps,single
  model_baseline: GUI-Owl-1.5-8B-Instruct
  inference_backend: transformers_lmms_eval
