task: task_screenspot_pro_guiowl
dataset_path: json
dataset_kwargs:
  data_files: "data/screenspot_pro/eval_index.json"
test_split: train
output_type: generate_until
doc_to_visual: !function utils.screenspot_pro_doc_to_visual
doc_to_text: ""
doc_to_messages: !function utils.screenspot_pro_doc_to_messages
doc_to_target: !function utils.screenspot_pro_doc_to_target
process_results: !function utils.screenspot_pro_process_result
generation_kwargs:
  max_new_tokens: 2048
  temperature: 0
  do_sample: false
  early_stop_on_action: false
metric_list:
  - metric: screenspot_pro_center_acc
    aggregation: !function utils.screenspot_pro_aggregate_center_acc
    higher_is_better: true
  - metric: screenspot_pro_action_acc
    aggregation: !function utils.screenspot_pro_aggregate_action_acc
    higher_is_better: true
lmms_eval_specific_kwargs:
  media_dir: "data/screenspot_pro/images"
  coordinate_type: "normalized"
  screenspot_eval: true
  supports_session_kv: false
metadata:
  version: 1
  protocol: screenspot_pro_center_acc_v1
  official_ref: "72.9% center acc (no crop)"
  model_baseline: GUI-Owl-1.5-8B-Instruct
  inference_backend: transformers_lmms_eval
